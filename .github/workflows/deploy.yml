name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish the current main from the Actions tab without a commit.
  workflow_dispatch:

# The minimum Pages needs: read the repo, write a Pages deployment, and mint the
# OIDC token deploy-pages uses to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push supersedes an in-flight one rather than
# racing it to publish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
