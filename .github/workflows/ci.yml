name: CI

# Gate on every pull request and on branch pushes. `main` is covered by the
# deploy workflow, which runs the same checks before it publishes anything.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
